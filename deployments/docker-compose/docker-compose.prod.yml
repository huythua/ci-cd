version: '3.8'

services:
  backend-api:
    build:
      context: ../../apps/backend-api
      dockerfile: Dockerfile
    container_name: devops-backend-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_VERSION=1.0.0
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - devops-network

  frontend-web:
    build:
      context: ../../apps/frontend-web
      dockerfile: Dockerfile
    container_name: devops-frontend-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - API_URL=http://backend-api:8000
    depends_on:
      backend-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - devops-network

networks:
  devops-network:
    driver: bridge
