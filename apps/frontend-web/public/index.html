<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps CI/CD Lab Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 27, 46, 0.85);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --success: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background-image: radial-gradient(circle at 50% 20%, rgba(56, 189, 248, 0.12), transparent 40%);
    }
    .container {
      max-width: 800px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem;
      backdrop-filter: blur(16px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
    }
    .badge {
      font-size: 0.8rem;
      background: var(--accent-glow);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-family: 'JetBrains Mono', monospace;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      padding: 1.25rem;
      border-radius: 12px;
    }
    .card h3 { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 0.5rem; }
    .status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--success);
      margin-right: 0.5rem;
      box-shadow: 0 0 10px var(--success);
    }
    pre {
      background: #0f172a;
      padding: 1rem;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      overflow-x: auto;
      color: #38bdf8;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h2>🚀 DevOps CI/CD Lab</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">Microservice Container & Pipeline Environment</p>
      </div>
      <span class="badge">v1.0.0-RELEASE</span>
    </div>

    <div class="grid">
      <div class="card">
        <h3><span class="status-dot"></span>Frontend Web</h3>
        <p><strong>Port:</strong> 3000</p>
        <p><strong>Status:</strong> Healthy (Express Runtime)</p>
      </div>
      <div class="card">
        <h3><span class="status-dot"></span>Backend API</h3>
        <p><strong>Port:</strong> 8000</p>
        <p><strong>Status:</strong> Healthy (FastAPI Python 3.11)</p>
      </div>
    </div>

    <h3 style="margin-bottom: 0.75rem; font-size: 1rem;">Pipeline Health Check Payload:</h3>
    <pre id="api-output">Connecting to Backend API...</pre>
  </div>

  <script>
    fetch('/health')
      .then(res => res.json())
      .then(data => {
        document.getElementById('api-output').textContent = JSON.stringify(data, null, 2);
      })
      .catch(err => {
        document.getElementById('api-output').textContent = 'Error: ' + err.message;
      });
  </script>
</body>
</html>
