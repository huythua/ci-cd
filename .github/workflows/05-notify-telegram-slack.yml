name: 05 - Notification & ChatOps (Telegram / Slack)

on:
  workflow_run:
    workflows: ["04 - Continuous Delivery (Automated Deployment)"]
    types: [completed]
  workflow_dispatch:

jobs:
  notify:
    name: Send Deployment Status
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ===================================================
      # Gửi thông báo Telegram (Ví dụ thực tế)
      # ===================================================
      - name: 📢 Send Telegram Notification
        if: always()
        run: |
          STATUS="${{ github.event.workflow_run.conclusion || 'success' }}"
          if [ "$STATUS" = "success" ]; then
            EMOJI="✅ SUCCESS"
          else
            EMOJI="❌ FAILED"
          fi

          MESSAGE="🚀 <b>CI/CD Deployment Report</b>%0A"
          MESSAGE="$MESSAGE------------------------------------%0A"
          MESSAGE="$MESSAGE<b>Status:</b> $EMOJI%0A"
          MESSAGE="$MESSAGE<b>Repository:</b> ${{ github.repository }}%0A"
          MESSAGE="$MESSAGE<b>Branch:</b> ${{ github.ref_name }}%0A"
          MESSAGE="$MESSAGE<b>Commit:</b> <code>${{ github.sha }}</code>%0A"
          MESSAGE="$MESSAGE<b>Author:</b> ${{ github.actor }}%0A"
          MESSAGE="$MESSAGE------------------------------------%0A"
          MESSAGE="$MESSAGE🔗 <a href='https://github.com/${{ github.repository }}/actions'>View Pipeline Details</a>"

          echo "Simulating Telegram Bot Notification:"
          echo "Payload: $MESSAGE"
          
          # Lệnh thực tế gửi qua Telegram Bot API (Khi có TELEGRAM_BOT_TOKEN & TELEGRAM_CHAT_ID):
          # curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          #   -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          #   -d parse_mode="HTML" \
          #   -d text="$MESSAGE"
