name: 01 - Continuous Integration (Lint & Test)

on:
  push:
    branches: [ main, develop, 'feature/**' ]
    paths:
      - 'apps/**'
      - '.github/workflows/01-ci-test-lint.yml'
  pull_request:
    branches: [ main, develop ]

jobs:
  # ===================================================
  # Job 1: Test & Lint Backend (Python FastAPI)
  # ===================================================
  test-backend:
    name: Backend Lint & Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend-api

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Run Flake8 Linter
        run: |
          # Dừng build nếu có syntax errors hoặc undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Cảnh báo style guide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: 🧪 Run Pytest with Coverage
        run: |
          pytest tests/ --cov=app --cov-report=term-missing --cov-report=xml

      - name: 📊 Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: apps/backend-api/coverage.xml
          if-no-files-found: ignore

  # ===================================================
  # Job 2: Test Frontend (Node.js)
  # ===================================================
  test-frontend:
    name: Frontend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend-web

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/frontend-web/package.json

      - name: 📦 Install dependencies
        run: npm install

      - name: 🧪 Run Unit Tests
        run: npm test
